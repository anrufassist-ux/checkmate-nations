<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// "Excalibur" ad for the AI Challenge: every frame is a pure function of t (window.seek)
const W = 1080, H = 1920, ctx = document.getElementById('c').getContext('2d');
const OPS = '"BlackOps", Impact, sans-serif', BC = '"BarlowC", Arial Narrow, sans-serif';
const GOLD = '#f2c94c', RED = '#ff3b3b', INK = '#05080d';

// TIMELINE (voiceover phrase starts: 0 legend, 4.81 sword, 6.79 everyone, 8.38 nobody, 10.53 punishes,
// 12.76 tired, 15.10 hall, 16.56 empty, 18.44 will you, 20.86 url; voice incl. reverb ends 26.07)
const T = { hookIn: -1.2, legend2: 1.6, swordIn: 4.65, tries: 6.65, nobody: 8.25, s2out: 10.35,
  plate2: 10.4, plate3: 12.0, plate4: 13.5, punish: 10.45, tired: 12.65, s3out: 14.95,
  hallIn: 14.95, empty: 16.45, s4out: 18.3, willIn: 18.35, urlIn: 20.75, END: 27 };

const img = {}, plates = ['p1','p2','p3','p4','p5'];
const fonts = [['BlackOps','fonts/black-ops-one-latin-400-normal.woff2',400],['BarlowC','fonts/barlow-condensed-latin-700-normal.woff2',700],['BarlowC','fonts/barlow-condensed-latin-600-normal.woff2',600]];
window.ready = Promise.all([
  ...fonts.map(([n,u,w]) => new FontFace(n, `url(${u})`, { weight: String(w) }).load().then(f => document.fonts.add(f))),
  ...plates.map(k => new Promise(r => { const i = new Image(); i.onload = r; i.src = 'plates/' + k + '.png'; img[k] = i; }))
]).then(() => window.seek(0));

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
function spring(t, k = 170, d = 26) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
const snap = t => spring(t, 260, 22), heavy = t => spring(t, 140, 26);
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const vis = (t, a, b) => t >= a - 0.1 && t <= b + 0.9;
const fadeWin = (t, a, b, fi = .35, fo = .35) => clamp((t - a) / fi) * (1 - clamp((t - b) / fo));

// big centred headline, auto-fit to maxW, slams in (scale 1.25 -> 1) with a short shake
function head(t, s, y, size, color, tIn, tOut, opt = {}) {
  const { font = OPS, maxW = 960, glow = color, stroke = true } = opt;
  const a = clamp((t - tIn) / .18) * (tOut == null ? 1 : 1 - clamp((t - tOut) / .3));
  if (a <= .001) return;
  ctx.save(); ctx.font = `${opt.weight || 400} ${size}px ${font}`;
  let w = ctx.measureText(s).width, k = w > maxW ? maxW / w : 1;
  const sc = k * (1 + .25 * (1 - snap(t - tIn))), sh = (1 - clamp((t - tIn) / .35)) * 10 * Math.sin((t - tIn) * 90);
  ctx.translate(W / 2 + sh, y); ctx.scale(sc, sc); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = glow; ctx.shadowBlur = 40;
  if (stroke) { ctx.lineWidth = 14; ctx.strokeStyle = '#000'; ctx.strokeText(s, 0, 0); }
  ctx.fillStyle = color; ctx.fillText(s, 0, 0); ctx.restore();
}
// image plate with slow push-in and darkening
function plate(k, t, t0, z0 = 1.04, z1 = 1.16, dark = .35, fx = 0, fy = 0) {
  const im = img[k]; if (!im) return; const z = z0 + (z1 - z0) * ease((t - t0) / 6);
  ctx.save(); ctx.translate(W / 2 + fx, H / 2 + fy); ctx.scale(z, z); ctx.drawImage(im, -W / 2, -H / 2, W, H); ctx.restore();
  ctx.fillStyle = `rgba(0,0,0,${dark})`; ctx.fillRect(0, 0, W, H);
}
function vignette(s = .85) {
  const g = ctx.createRadialGradient(W / 2, H * .46, H * .18, W / 2, H * .5, H * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${s})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// drifting dust in the light
function dust(t, n = 60, col = '255,230,170') {
  for (let i = 0; i < n; i++) { const x = (hash(i) * W + t * 14 * (hash(i + 9) - .5)) % W, y = (hash(i + 3) * H - t * 22 * (.4 + hash(i + 5))) % H;
    ctx.fillStyle = `rgba(${col},${.25 + .35 * hash(i + 7)})`; ctx.beginPath(); ctx.arc(x < 0 ? x + W : x, y < 0 ? y + H : y, 1.5 + 2.5 * hash(i + 2), 0, 7); ctx.fill(); }
}
function flash(t, at, d = .25, col = '255,255,255') { const a = 1 - clamp((t - at) / d); if (t >= at && a > 0) { ctx.fillStyle = `rgba(${col},${a * .85})`; ctx.fillRect(0, 0, W, H); } }

// ---------- scene 1: the legend (AI army, dark) ----------
function s1(t) {
  if (!vis(t, -2, T.swordIn)) return;
  ctx.save(); ctx.globalAlpha = 1 - clamp((t - T.swordIn) / .35);
  plate('p1', t, -1.2, 1.06, 1.2, .3, 0, 330); vignette(.9);
  // god ray from the top
  const g = ctx.createLinearGradient(0, 0, 0, H * .7); g.addColorStop(0, 'rgba(255,220,150,.22)'); g.addColorStop(1, 'rgba(255,220,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(W * .42, 0); ctx.lineTo(W * .58, 0); ctx.lineTo(W * .85, H * .7); ctx.lineTo(W * .15, H * .7); ctx.fill();
  dust(t);
  head(t, 'LEGEND SAYS…', 250, 92, '#fff', T.hookIn, null, { glow: 'rgba(255,255,255,.4)' });
  head(t, 'ONE AI', 420, 170, GOLD, T.hookIn, null);
  head(t, 'CANNOT BE BEATEN', 570, 118, GOLD, T.hookIn + .15, null);
  ctx.restore();
}

// ---------- scene 2: the sword in the stone ----------
function sword(t, cx, baseY, shake) {
  ctx.save(); ctx.translate(cx + shake, baseY);
  // blade (only the upper part shows, the rest is in the stone)
  const bl = ctx.createLinearGradient(-26, 0, 26, 0); bl.addColorStop(0, '#9aa4ad'); bl.addColorStop(.5, '#f4f7fa'); bl.addColorStop(1, '#7d8790');
  ctx.fillStyle = bl; ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-26, -360); ctx.lineTo(26, -360); ctx.lineTo(26, 0); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(-3, -360, 6, 360);
  // guard
  const gd = ctx.createLinearGradient(0, -400, 0, -360); gd.addColorStop(0, '#ffe08a'); gd.addColorStop(1, '#b8892a');
  ctx.fillStyle = gd; ctx.beginPath(); ctx.roundRect(-170, -400, 340, 44, 22); ctx.fill();
  // grip + pommel
  ctx.fillStyle = '#5b3a1e'; ctx.fillRect(-22, -590, 44, 190);
  ctx.strokeStyle = '#3a2410'; ctx.lineWidth = 6; for (let y = -585; y < -405; y += 22) { ctx.beginPath(); ctx.moveTo(-22, y); ctx.lineTo(22, y + 14); ctx.stroke(); }
  ctx.fillStyle = gd; ctx.beginPath(); ctx.arc(0, -615, 40, 0, 7); ctx.fill();
  ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(0, -615, 16, 0, 7); ctx.fill();
  ctx.restore();
}
function stone(cx, y) {
  ctx.save(); ctx.translate(cx, y);
  ctx.fillStyle = '#2a2f36'; ctx.beginPath(); ctx.moveTo(-330, 260); ctx.quadraticCurveTo(-360, 40, -220, -10); ctx.quadraticCurveTo(0, -70, 220, -10);
  ctx.quadraticCurveTo(360, 40, 330, 260); ctx.closePath(); ctx.fill();
  // a chessboard carved into the top of the stone
  ctx.save(); ctx.clip();
  for (let r = 0; r < 6; r++) for (let f = 0; f < 10; f++) { if ((r + f) % 2) continue;
    ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(-330 + f * 66, -60 + r * 55, 66, 55); }
  const sh = ctx.createLinearGradient(0, -60, 0, 260); sh.addColorStop(0, 'rgba(255,220,150,.18)'); sh.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = sh; ctx.fillRect(-400, -80, 800, 360); ctx.restore(); ctx.restore();
}
function s2(t) {
  if (!vis(t, T.swordIn, T.s2out)) return;
  ctx.save(); ctx.globalAlpha = fadeWin(t, T.swordIn, T.s2out);
  const bg = ctx.createRadialGradient(W / 2, 980, 50, W / 2, 1000, 1100); bg.addColorStop(0, '#2b2418'); bg.addColorStop(1, INK);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // light shaft on the sword
  const g = ctx.createLinearGradient(0, 0, 0, 1300); g.addColorStop(0, 'rgba(255,225,160,.35)'); g.addColorStop(1, 'rgba(255,225,160,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(W * .44, 0); ctx.lineTo(W * .56, 0); ctx.lineTo(W * .78, 1300); ctx.lineTo(W * .22, 1300); ctx.fill();
  dust(t, 80);
  const z = 1.55 + .08 * ease((t - T.swordIn) / 6); ctx.save(); ctx.translate(W / 2, 1470); ctx.scale(z, z); ctx.translate(-W / 2, -1150);
  // "everyone tries": the sword shakes but stays
  const tr = t - T.tries, shake = tr > 0 && tr < 1.2 ? Math.sin(tr * 70) * 9 * (1 - tr / 1.2) : 0;
  sword(t, W / 2, 1130, shake); stone(W / 2, 1130); ctx.restore();
  head(t, 'LIKE THE SWORD', 190, 110, '#fff', T.swordIn, T.s2out - .2, { glow: 'rgba(255,255,255,.35)' });
  head(t, 'IN THE STONE', 320, 110, '#fff', T.swordIn + .12, T.s2out - .2, { glow: 'rgba(255,255,255,.35)' });
  head(t, 'EVERYONE TRIES.', 1700, 96, GOLD, T.tries, T.nobody - .1);
  head(t, 'NOBODY PULLS IT OUT.', 1700, 96, RED, T.nobody, T.s2out - .2);
  vignette(.7); ctx.restore();
}

// ---------- scene 3: the AI punishes (real game shots, hard cuts with flashes) ----------
function s3(t) {
  if (!vis(t, T.plate2, T.s3out)) return;
  ctx.save(); ctx.globalAlpha = fadeWin(t, T.plate2, T.s3out, .05, .3);
  const k = t < T.plate3 ? 'p2' : t < T.plate4 ? 'p3' : 'p4', t0 = t < T.plate3 ? T.plate2 : t < T.plate4 ? T.plate3 : T.plate4;
  plate(k, t, t0, 1.12, 1.3, .25); vignette(.75);
  // red tint pulse on each cut
  const pulse = 1 - clamp((t - t0) / .6); ctx.fillStyle = `rgba(160,0,0,${.28 * pulse})`; ctx.fillRect(0, 0, W, H);
  head(t, 'IT PUNISHES', 360, 130, '#fff', T.punish, T.tired - .15);
  head(t, 'EVERY MISTAKE', 500, 130, RED, T.punish + .12, T.tired - .15);
  head(t, 'AND IT NEVER', 360, 130, '#fff', T.tired, T.s3out - .2);
  head(t, 'GETS TIRED', 500, 130, RED, T.tired + .12, T.s3out - .2);
  flash(t, T.plate2, .2); flash(t, T.plate3, .2); flash(t, T.plate4, .2);
  ctx.restore();
}

// ---------- scene 4: the empty Hall of Fame ----------
function s4(t) {
  if (!vis(t, T.hallIn, T.s4out)) return;
  ctx.save(); ctx.globalAlpha = fadeWin(t, T.hallIn, T.s4out, .3, .25);
  plate('p5', t, T.hallIn, 1.05, 1.12, .62); vignette(.8);
  const s = snap(t - T.hallIn - .1), x = 110, w = W - 220, y = 520, h = 820;
  ctx.save(); ctx.translate(W / 2, y + h / 2); ctx.scale(.85 + .15 * s, .85 + .15 * s); ctx.globalAlpha *= clamp(s * 1.5); ctx.translate(-W / 2, -(y + h / 2));
  ctx.fillStyle = 'rgba(8,10,14,.86)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 34); ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = GOLD; ctx.stroke();
  ctx.fillStyle = GOLD; ctx.font = `400 92px ${OPS}`; ctx.textAlign = 'center'; ctx.fillText('HALL OF FAME', W / 2, y + 140);
  ctx.font = `600 44px ${BC}`; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText('PLAYERS WHO BEAT THE AI', W / 2, y + 210);
  for (let i = 0; i < 4; i++) { const ry = y + 300 + i * 115;
    ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.beginPath(); ctx.roundRect(x + 50, ry, w - 100, 86, 16); ctx.fill();
    ctx.textAlign = 'left'; ctx.font = `700 54px ${BC}`; ctx.fillStyle = 'rgba(242,201,76,.8)'; ctx.fillText(`${i + 1}.`, x + 80, ry + 62);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + 160, ry + 42, w - 290, 6); }
  ctx.restore();
  // stamp "0 WINNERS"
  const st = t - T.empty;
  if (st > 0) { const k = snap(st * 1.2); ctx.save(); ctx.translate(W / 2, 1080); ctx.rotate(-.12); ctx.scale(2.2 - 1.2 * k, 2.2 - 1.2 * k); ctx.globalAlpha *= clamp(st / .12);
    ctx.lineWidth = 10; ctx.strokeStyle = RED; ctx.beginPath(); ctx.roundRect(-390, -95, 780, 190, 20); ctx.stroke();
    ctx.fillStyle = RED; ctx.font = `400 118px ${OPS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('0 WINNERS', 0, 8); ctx.restore(); }
  head(t, 'STILL EMPTY.', 1530, 110, '#fff', T.empty, T.s4out - .2);
  ctx.restore();
}

// ---------- scene 5: will you be the first? ----------
function s5(t) {
  if (t < T.willIn - .1) return;
  const bg = ctx.createRadialGradient(W / 2, 760, 40, W / 2, 900, 1200); bg.addColorStop(0, '#3a2b0e'); bg.addColorStop(1, INK);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // rotating light rays behind the question
  ctx.save(); ctx.translate(W / 2, 760); ctx.rotate(t * .12);
  for (let i = 0; i < 14; i++) { ctx.rotate(Math.PI * 2 / 14); ctx.fillStyle = 'rgba(242,201,76,.06)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-90, -1400); ctx.lineTo(90, -1400); ctx.fill(); }
  ctx.restore(); dust(t, 70);
  head(t, 'WILL YOU', 640, 190, '#fff', T.willIn, null, { glow: 'rgba(255,255,255,.4)' });
  head(t, 'BE THE FIRST?', 840, 150, GOLD, T.willIn + .35, null);
  // URL card
  const u = snap(t - T.urlIn);
  if (u > 0) { ctx.save(); ctx.globalAlpha = clamp(u * 1.4); ctx.translate(W / 2, 1180 + (1 - u) * 60);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(-430, -80, 860, 160, 80); ctx.fill();
    ctx.fillStyle = INK; ctx.font = `700 76px ${BC}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('checkmatenations.com', 0, 4); ctx.restore();
    const v = snap(t - T.urlIn - .35); ctx.save(); ctx.globalAlpha = clamp(v * 1.4); ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.font = `600 50px ${BC}`; ctx.textAlign = 'center'; ctx.fillText('AI CHALLENGE · FREE · NO DOWNLOAD', W / 2, 1360); ctx.restore(); }
  flash(t, T.willIn, .3, '255,236,190');
  vignette(.6);
  const out = clamp((t - (T.END - .8)) / .8); if (out > 0) { ctx.fillStyle = `rgba(0,0,0,${out})`; ctx.fillRect(0, 0, W, H); }
}

window.seek = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowColor = 'transparent';
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  s1(t); s2(t); s3(t); s4(t); s5(t);
};
</script></body></html>
