<!doctype html><html><head><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body>
<script src="../../vendor/three-r128.min.js"></script>
<script>
const S=+new URLSearchParams(location.search).get('s')||1024, BG=new URLSearchParams(location.search).get('bg');
const T=THREE, r=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setSize(S,S); r.setPixelRatio(1); r.outputEncoding=T.sRGBEncoding; r.toneMapping=T.ACESFilmicToneMapping; r.toneMappingExposure=1.1;
r.shadowMap.enabled=true; document.body.appendChild(r.domElement);
const sc=new T.Scene(); if(BG) sc.background=new T.Color(BG);
const cam=new T.PerspectiveCamera(30,1,.1,100); cam.position.set(0,3.2,10.8); cam.lookAt(0,2.1,0);
// king profile (radius, height), lathed
const pts=[[0,0],[1.22,0],[1.25,.08],[1.25,.22],[1.12,.3],[1.0,.36],[.98,.46],[1.06,.52],[1.0,.6],[.78,.68],[.62,.9],[.52,1.3],[.46,1.8],[.44,2.2],[.6,2.28],[.66,2.36],[.58,2.44],[.46,2.5],[.5,2.62],[.62,2.9],[.74,3.16],[.76,3.24],[.68,3.3],[.4,3.36],[.2,3.42],[0,3.44]].map(p=>new T.Vector2(p[0],p[1]));
const gold=new T.MeshStandardMaterial({color:0xb89b5c,metalness:.9,roughness:.3});
const king=new T.Mesh(new T.LatheGeometry(pts,96),gold); king.castShadow=true; king.position.y=.34; sc.add(king);
const bar=(w,h,d,y)=>{ const m=new T.Mesh(new T.BoxGeometry(w,h,d),gold); m.position.y=y; m.castShadow=true; sc.add(m); };
bar(.2,.78,.2,4.08); bar(.62,.2,.2,4.16);
const sph=new T.Mesh(new T.SphereGeometry(.14,32,16),gold); sph.position.y=3.72; sc.add(sph);
// base: two half discs in USA blue and Russia red
const half=(c,t0)=>{ const m=new T.Mesh(new T.CylinderGeometry(1.48,1.52,.34,96,1,false,t0,Math.PI),new T.MeshStandardMaterial({color:c,metalness:.2,roughness:.45})); m.position.y=.17; m.receiveShadow=true; sc.add(m); };
half(0x2c5fb8,0); half(0xb8352b,Math.PI);
sc.add(new T.HemisphereLight(0xfff1d6,0x1a1f1d,.25));
const key=new T.DirectionalLight(0xfff0d0,1.5); key.position.set(4,7,6); key.castShadow=true; sc.add(key);
const rim=new T.DirectionalLight(0x9fc0ff,1.1); rim.position.set(-6,4,-5); sc.add(rim);
const fill=new T.DirectionalLight(0xffc9a0,.35); fill.position.set(-5,2,6); sc.add(fill);
// soft environment for the metal
const pm=new T.PMREMGenerator(r); const env=new T.Scene(); env.background=new T.Color(0x0c0c0a);
const l1=new T.Mesh(new T.PlaneGeometry(6,3),new T.MeshBasicMaterial({color:0x8a8070})); l1.position.set(0,4,4); l1.lookAt(0,0,0); env.add(l1);
const l2=new T.Mesh(new T.PlaneGeometry(3,6),new T.MeshBasicMaterial({color:0x40506a})); l2.position.set(-5,1,-2); l2.lookAt(0,0,0); env.add(l2);
sc.environment=pm.fromScene(env,.04).texture;
sc.rotation.y=.12;
const seen=new Set(); sc.traverse(o=>{ if(o.material&&!seen.has(o.material)){ seen.add(o.material); o.material.color.convertSRGBToLinear(); } });
r.render(sc,cam); window.done=true;
</script></body></html>
